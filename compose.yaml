# Generated by scripts/generate-compose.sh. Re-run setup-network.sh to change topology.
name: elements-localnet

x-node-common: &node-common
  image: elements-localnet-node:23.3.4
  restart: unless-stopped
  read_only: true
  tmpfs:
    - /tmp:size=16m,mode=1777
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  networks:
    - localnet
  healthcheck:
    test: ["CMD", "/usr/local/bin/node-healthcheck"]
    interval: 5s
    timeout: 6s
    retries: 30
    start_period: 10s

services:
  node-01:
    <<: *node-common
    build:
      context: .
      dockerfile: Dockerfile
      args:
        LOCAL_UID: "1000"
        LOCAL_GID: "1000"
    container_name: elements-localnet-node-01
    hostname: node-01
    command: ["-datadir=/data", "-conf=/config/elements.conf", "-printtoconsole=1"]
    volumes:
      - node-01-data:/data
      - ./generated/nodes/node-01/elements.conf:/config/elements.conf:ro
    ports:
      - "127.0.0.1:7041:7040"
      - "0.0.0.0:7142:7042"
    networks:
      localnet:
        ipv4_address: 172.28.239.11
  node-02:
    <<: *node-common
    container_name: elements-localnet-node-02
    hostname: node-02
    command: ["-datadir=/data", "-conf=/config/elements.conf", "-printtoconsole=1"]
    volumes:
      - node-02-data:/data
      - ./generated/nodes/node-02/elements.conf:/config/elements.conf:ro
    ports:
      - "127.0.0.1:7042:7040"
      - "0.0.0.0:7143:7042"
    networks:
      localnet:
        ipv4_address: 172.28.239.12
    depends_on:
      node-01:
        condition: service_healthy
  node-03:
    <<: *node-common
    container_name: elements-localnet-node-03
    hostname: node-03
    command: ["-datadir=/data", "-conf=/config/elements.conf", "-printtoconsole=1"]
    volumes:
      - node-03-data:/data
      - ./generated/nodes/node-03/elements.conf:/config/elements.conf:ro
    ports:
      - "127.0.0.1:7043:7040"
      - "0.0.0.0:7144:7042"
    networks:
      localnet:
        ipv4_address: 172.28.239.13
    depends_on:
      node-01:
        condition: service_healthy
  node-04:
    <<: *node-common
    container_name: elements-localnet-node-04
    hostname: node-04
    command: ["-datadir=/data", "-conf=/config/elements.conf", "-printtoconsole=1"]
    volumes:
      - node-04-data:/data
      - ./generated/nodes/node-04/elements.conf:/config/elements.conf:ro
    ports:
      - "127.0.0.1:7044:7040"
      - "0.0.0.0:7145:7042"
    networks:
      localnet:
        ipv4_address: 172.28.239.14
    depends_on:
      node-01:
        condition: service_healthy
  node-05:
    <<: *node-common
    container_name: elements-localnet-node-05
    hostname: node-05
    command: ["-datadir=/data", "-conf=/config/elements.conf", "-printtoconsole=1"]
    volumes:
      - node-05-data:/data
      - ./generated/nodes/node-05/elements.conf:/config/elements.conf:ro
    ports:
      - "127.0.0.1:7045:7040"
      - "0.0.0.0:7146:7042"
    networks:
      localnet:
        ipv4_address: 172.28.239.15
    depends_on:
      node-01:
        condition: service_healthy
  producer:
    build:
      context: .
      dockerfile: producer/Dockerfile
      args:
        LOCAL_UID: "1000"
        LOCAL_GID: "1000"
    image: elements-localnet-producer:23.3.4
    container_name: elements-localnet-producer
    profiles: ["producer"]
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=8m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    environment:
      RPC_URL: http://node-01:7040
      RPC_CREDENTIALS_FILE: /run/localnet/node-01.rpc
      PAYOUT_ADDRESS_FILE: /run/localnet/payout-address
      BLOCK_INTERVAL: "60"
      PRODUCER_MODE: automatic
    volumes:
      - producer-lock:/producer-lock
      - producer-status:/producer-status
      - ./generated/secrets/node-01.rpc:/run/localnet/node-01.rpc:ro
      - ./generated/public/payout-address:/run/localnet/payout-address:ro
    networks:
      - localnet
    depends_on:
      node-01:
        condition: service_healthy

  network-status:
    build:
      context: ./network-status
      dockerfile: Dockerfile
      args:
        LOCAL_UID: "1000"
        LOCAL_GID: "1000"
    image: elements-localnet-network-status:phase1
    container_name: elements-localnet-network-status
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=8m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    environment:
      INVENTORY_FILE: /run/localnet/inventory.json
    volumes:
      - ./generated/inventory.json:/run/localnet/inventory.json:ro
      - ./generated/secrets/monitor:/run/monitor-secrets:ro
      - producer-status:/run/producer-status:ro
    ports:
      - "127.0.0.1:8080:8080"
    networks:
      - localnet
    depends_on:
      node-01:
        condition: service_started
    healthcheck:
      test: ["CMD", "/usr/local/bin/network-status", "-healthcheck"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s

networks:
  localnet:
    name: elements-localnet-bridge
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.239.0/24

volumes:
  node-01-data:
    external: true
    name: elements-localnet-phase11-node-01-data
  node-02-data:
    external: true
    name: elements-localnet-phase11-node-02-data
  node-03-data:
    external: true
    name: elements-localnet-phase11-node-03-data
  node-04-data:
    external: true
    name: elements-localnet-phase11-node-04-data
  node-05-data:
    external: true
    name: elements-localnet-phase11-node-05-data
  producer-lock:
    external: true
    name: elements-localnet-phase11-producer-lock
  producer-status:
    external: true
    name: elements-localnet-phase11-producer-status
