<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>elements-localnet status</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <header class="shell masthead">
    <div>
      <p class="eyebrow">ELEMENTS · LOCAL DEVELOPMENT NETWORK</p>
      <h1 id="network-name">elements-localnet</h1>
      <p class="subtitle">Read-only network telemetry</p>
    </div>
    <div class="refresh-panel">
      <label for="refresh-rate">Refresh</label>
      <select id="refresh-rate" aria-label="Automatic refresh interval">
        <option value="5000">5 seconds</option>
        <option value="10000" selected>10 seconds</option>
        <option value="30000">30 seconds</option>
        <option value="60000">1 minute</option>
      </select>
      <button id="refresh" type="button">Refresh now</button>
      <span id="updated" aria-live="polite">Waiting for data…</span>
    </div>
  </header>

  <main class="shell">
    <section aria-labelledby="overview-title">
      <div class="section-heading"><h2 id="overview-title">Network overview</h2><span id="chain-pill" class="pill">chain —</span></div>
      <div id="summary" class="summary-grid" aria-live="polite"></div>
    </section>

    <section class="split" aria-label="Economics and producer">
      <article class="panel"><h2>Reward schedule</h2><div id="economics" class="detail-grid"></div></article>
      <article class="panel"><h2>Block producer</h2><div id="producer" class="detail-grid"></div></article>
    </section>

    <section class="panel" aria-labelledby="topology-title">
      <div class="section-heading"><h2 id="topology-title">Topology</h2><span class="legend"><i class="dot healthy"></i> connected <i class="dot offline"></i> unavailable</span></div>
      <div id="topology" class="topology" role="img" aria-label="Node peer topology"></div>
    </section>

    <section aria-labelledby="nodes-title">
      <div class="section-heading node-tools">
        <h2 id="nodes-title">Nodes</h2>
        <label class="search"><span class="sr-only">Filter nodes</span><input id="filter" type="search" placeholder="Filter by node, role, or state" autocomplete="off"></label>
      </div>
      <div id="nodes" class="node-grid"></div>
    </section>
  </main>
  <footer class="shell">Monitoring only · No wallet access · No control API</footer>
  <script src="/app.js" defer></script>
</body>
</html>
